# APRS Server Configuration
# Configuración del servidor APRS para TrackDirect

# Identificación del servidor
ServerId APRS-SERVER
ServerPass 12345
MyAdmin "Tu Nombre, TU_INDICATIVO"
MyEmail tu_email@example.com

# Puertos de escucha
# Puerto completo de datos APRS
Listen fullfeed tcp 10152 fullfeed
# Puerto con filtros definidos por el cliente
Listen clientfiltered tcp 14580 filter
# Puerto para paquetes duplicados
Listen dupefeed tcp 10155 dupefeed

# Conexión a servidor APRS upstream
Uplink "rotate.aprs.net" 10152

# Página de estado HTTP
HTTPStatus 14501

# Configuración de logs
LogRotate "megabytes 10"

# Timeout de conexión
ClientTimeout 30

# Permitir paquetes no verificados
# MagicBadness 1
