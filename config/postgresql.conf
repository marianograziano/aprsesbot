# PostgreSQL Configuration
# Configuración optimizada para TrackDirect

# Memoria
shared_buffers = 2048MB          # 25% de RAM total
effective_cache_size = 6GB       # 50-75% de RAM total
work_mem = 64MB
maintenance_work_mem = 512MB

# Escritura y commit
synchronous_commit = off         # Mejor rendimiento
commit_delay = 100000            # 0.1s delay en commits
wal_buffers = 16MB
checkpoint_completion_target = 0.9

# Logs
log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# Rendimiento
max_connections = 100
